name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      # Node 22 ships npm 10.x; the .npmrc relies on min-release-age (npm 11.10+).
      - run: npm install -g npm@latest
      - run: npm ci
      # .npmrc sets ignore-scripts=true, so postinstall (wxt prepare) is skipped
      # on npm ci. Generate .wxt/ explicitly so standalone tsc/vitest steps work.
      - run: npx wxt prepare
      - run: npm run typecheck
      # Build before tests so the build-output suite (which asserts the runtime
      # HTML entrypoints are bundled) runs against a fresh dist/ instead of
      # silently skipping.
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install -g npm@latest
      - run: npm ci
      # ignore-scripts=true skips postinstall (wxt prepare); generate .wxt/ here.
      - run: npx wxt prepare
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: xvfb-run --auto-servernum -- npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

